<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#091518">
  <link rel="icon" href="data:,">
  <title>Wayfarer — The Old Road</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071114; }
    body { display: grid; place-items: center; font-family: Georgia, serif; color: #f8e9bd; }
    #shell { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #193f3a 0, #0b2223 42%, #050b0d 100%); }
    #unity-canvas { display: block; width: min(100vw, 160vh); height: min(100vh, 62.5vw); background: #091518; box-shadow: 0 0 80px #000; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #071114; transition: opacity .55s ease; z-index: 5; }
    #loading.done { opacity: 0; pointer-events: none; }
    .sigil { width: 92px; height: 92px; margin: 0 auto 24px; border: 3px solid #d59b37; transform: rotate(45deg); display: grid; place-items: center; box-shadow: 0 0 36px #3fd5c955; }
    .sigil::after { content: "W"; transform: rotate(-45deg); color: #63d9cc; font: 700 42px Georgia, serif; }
    .title { text-align: center; font-size: clamp(28px, 5vw, 52px); letter-spacing: .12em; color: #f8e9bd; text-shadow: 0 3px #000; }
    .chapter { text-align: center; margin-top: 8px; color: #d59b37; letter-spacing: .22em; font: 700 12px Arial, sans-serif; }
    .track { width: min(420px, 68vw); height: 5px; margin-top: 30px; background: #203337; border: 1px solid #41575a; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #d59b37, #63d9cc); transition: width .12s linear; }
    #warning { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(700px, 90vw); text-align: center; font: 600 14px Arial, sans-serif; color: #fff; z-index: 8; }
    #warning div { padding: 12px 16px; margin-top: 8px; background: #7e271f; border: 1px solid #f3a176; }
    @media (max-aspect-ratio: 4/5) { #unity-canvas { width: 100vw; height: 62.5vw; } }
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
  </main>
  <section id="loading">
    <div>
      <div class="sigil"></div>
      <div class="title">WAYFARER</div>
      <div class="chapter">THE OLD ROAD</div>
      <div class="track"><div id="fill"></div></div>
    </div>
  </section>
  <div id="warning"></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const fill = document.querySelector('#fill');
    const warning = document.querySelector('#warning');
    function showBanner(message, type) {
      const item = document.createElement('div'); item.textContent = message; warning.appendChild(item);
      if (type !== 'error') setTimeout(() => item.remove(), 5000);
    }
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner,
      matchWebGLToCanvasSize: true
    }, progress => fill.style.width = `${Math.round(progress * 100)}%`)
      .then(instance => {
        loading.classList.add('done');
        window.wayfarer = instance;
      })
      .catch(message => showBanner(message, 'error'));
  </script>
</body>
</html>
